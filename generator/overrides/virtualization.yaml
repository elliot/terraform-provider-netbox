resources:
  # /api/virtualization/interfaces/ collides with dcim interfaces.
  virtualization/interfaces:
    name: vm_interface
    plural: vm_interfaces
    attributes:
      parent:
        target: vm_interface
      bridge:
        target: vm_interface
  virtual-machines:
    attributes:
      primary_ip4: { computed: true }
      primary_ip6: { computed: true }
