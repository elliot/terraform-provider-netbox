# dcim shard B: acceptance fixtures and tuning for device components,
# component templates, modules, inventory items, virtual chassis and VDCs.
# Generated fixtures for device, device_type, interface and cable live in
# _fixtures_pilot.yaml. See docs/validation/dcim-b.md for the outcome.
resources:
