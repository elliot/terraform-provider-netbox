# Acceptance-test fixtures and tuning for the extras + wireless shard.
# Keyed by API path segment. {{.Name}} is a unique tfacc- name, {{.Snake}}
# the same with underscores. See docs/validation/extras-wireless.md for the
# outcome of each resource against demo.netbox.dev.
resources:
  # ---------------------------------------------------------------- extras
  webhooks:
    serial_test: true
    test:
      basic: |
        resource "netbox_webhook" "test" {
          name        = "{{.Name}}"
          payload_url = "https://hooks.example.com/{{.Name}}"
          description = "{{.Name}} created by acceptance test"
        }
      update: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_webhook" "test" {
          name               = "{{.Name}}"
          payload_url        = "https://hooks.example.com/{{.Name}}/v2"
          description        = "{{.Name}} updated"
          http_method        = "PUT"
          http_content_type  = "application/json; charset=utf-8"
          additional_headers = "X-Source: netbox"
          body_template      = "{{ "{{" }} data | tojson {{ "}}" }}"
          secret             = "{{.Name}}-secret"
          ssl_verification   = false
          timeout            = 10
          tags               = [netbox_tag.test.slug]
        }
  event-rules:
    serial_test: true
    test:
      basic: |
        resource "netbox_webhook" "test" {
          name        = "{{.Name}}"
          payload_url = "https://hooks.example.com/{{.Name}}"
        }
        resource "netbox_event_rule" "test" {
          name               = "{{.Name}}"
          object_types       = ["dcim.site"]
          event_types        = ["object_created"]
          action_type        = "webhook"
          action_object_type = "extras.webhook"
          action_object_id   = netbox_webhook.test.id
        }
      update: |
        resource "netbox_webhook" "test" {
          name        = "{{.Name}}"
          payload_url = "https://hooks.example.com/{{.Name}}"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_event_rule" "test" {
          name               = "{{.Name}}"
          object_types       = ["dcim.site", "dcim.device"]
          event_types        = ["object_created", "object_updated"]
          action_type        = "webhook"
          action_object_type = "extras.webhook"
          action_object_id   = netbox_webhook.test.id
          enabled            = false
          description        = "{{.Name}} updated"
          conditions         = jsonencode({ attr = "status.value", value = "active" })
          tags               = [netbox_tag.test.slug]
        }
  journal-entries:
    attributes:
      # NetBox fills created_by with the requesting user; track it as a
      # server-computed value instead of sending null.
      created_by: { kind: fk, target: user, computed: true }
    test:
      basic: |
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_journal_entry" "test" {
          assigned_object_type = "dcim.site"
          assigned_object_id   = netbox_site.test.id
          comments             = "{{.Name}} created by acceptance test"
        }
      update: |
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_journal_entry" "test" {
          assigned_object_type = "dcim.site"
          assigned_object_id   = netbox_site.test.id
          comments             = "{{.Name}} updated"
          kind                 = "warning"
          tags                 = [netbox_tag.test.slug]
        }
  config-contexts:
    serial_test: true
    test:
      basic: |
        resource "netbox_config_context" "test" {
          name = "{{.Name}}"
          data = jsonencode({ ntp_servers = ["10.0.0.1"] })
        }
      update: |
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_config_context" "test" {
          name        = "{{.Name}}"
          description = "{{.Name}} updated"
          weight      = 500
          is_active   = false
          site_ids    = [netbox_site.test.id]
          tags        = [netbox_tag.test.slug]
          data        = jsonencode({ ntp_servers = ["10.0.0.1", "10.0.0.2"], syslog = { host = "10.0.0.3", port = 514 } })
        }
  config-context-profiles:
    test:
      basic: |
        resource "netbox_config_context_profile" "test" {
          name        = "{{.Name}}"
          description = "{{.Name}} created by acceptance test"
        }
      update: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_config_context_profile" "test" {
          name        = "{{.Name}}"
          description = "{{.Name}} updated"
          comments    = "Schema for NTP settings"
          schema      = jsonencode({
            type       = "object"
            properties = { ntp_servers = { type = "array", items = { type = "string" } } }
            required   = ["ntp_servers"]
          })
          tags = [netbox_tag.test.slug]
        }
  config-templates:
    test:
      basic: |
        resource "netbox_config_template" "test" {
          name          = "{{.Name}}"
          template_code = "hostname {{ "{{" }} device.name {{ "}}" }}"
        }
      update: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_config_template" "test" {
          name               = "{{.Name}}"
          description        = "{{.Name}} updated"
          template_code      = "hostname {{ "{{" }} device.name {{ "}}" }}\n{% for s in ntp_servers %}ntp server {{ "{{" }} s {{ "}}" }}\n{% endfor %}"
          environment_params = jsonencode({ trim_blocks = true })
          mime_type          = "text/plain"
          file_name          = "{{.Name}}"
          file_extension     = "cfg"
          as_attachment      = true
          tags               = [netbox_tag.test.slug]
        }
  export-templates:
    test:
      basic: |
        resource "netbox_export_template" "test" {
          name          = "{{.Name}}"
          object_types  = ["dcim.site"]
          template_code = "{% for obj in queryset %}{{ "{{" }} obj.name {{ "}}" }}\n{% endfor %}"
        }
      update: |
        resource "netbox_export_template" "test" {
          name           = "{{.Name}}"
          description    = "{{.Name}} updated"
          object_types   = ["dcim.site", "dcim.device"]
          template_code  = "name,status\n{% for obj in queryset %}{{ "{{" }} obj.name {{ "}}" }},{{ "{{" }} obj.status {{ "}}" }}\n{% endfor %}"
          mime_type      = "text/csv"
          file_name      = "{{.Name}}"
          file_extension = "csv"
          as_attachment  = true
        }
  custom-field-choice-sets:
    serial_test: true
    attributes:
      choice_colors:
        description: "Colors per choice value as a JSON object (`jsonencode({ gold = \"yellow\" })`). Values are NetBox colour names: `blue`, `indigo`, `purple`, `pink`, `red`, `orange`, `yellow`, `green`, `teal`, `cyan`, `gray`, `black`, `white` (not hex codes)."
    test:
      basic: |
        resource "netbox_custom_field_choice_set" "test" {
          name          = "{{.Name}}"
          extra_choices = [["bronze", "Bronze"], ["silver", "Silver"]]
        }
      update: |
        resource "netbox_custom_field_choice_set" "test" {
          name                 = "{{.Name}}"
          description          = "{{.Name}} updated"
          # With order_alphabetically NetBox returns the choices sorted, so list
          # them in that order to avoid a perpetual diff.
          extra_choices        = [["bronze", "Bronze"], ["gold", "Gold"], ["silver", "Silver"]]
          choice_colors        = jsonencode({ bronze = "orange", gold = "yellow" })
          order_alphabetically = true
        }
  custom-links:
    serial_test: true
    test:
      basic: |
        resource "netbox_custom_link" "test" {
          name         = "{{.Name}}"
          object_types = ["dcim.site"]
          link_text    = "Weather for {{ "{{" }} object.name {{ "}}" }}"
          link_url     = "https://weather.example.com/?q={{ "{{" }} object.physical_address | urlencode {{ "}}" }}"
        }
      update: |
        resource "netbox_custom_link" "test" {
          name         = "{{.Name}}"
          object_types = ["dcim.site", "dcim.location"]
          link_text    = "Weather for {{ "{{" }} object.name {{ "}}" }}"
          link_url     = "https://weather.example.com/?q={{ "{{" }} object.physical_address | urlencode {{ "}}" }}"
          enabled      = false
          weight       = 200
          group_name   = "External"
          button_class = "blue"
          new_window   = true
        }
  notification-groups:
    test:
      basic: |
        resource "netbox_user_group" "test" {
          name = "{{.Name}}"
        }
        resource "netbox_notification_group" "test" {
          name        = "{{.Name}}"
          description = "{{.Name}} created by acceptance test"
          group_ids   = [netbox_user_group.test.id]
        }
      update: |
        resource "netbox_user_group" "test" {
          name = "{{.Name}}"
        }
        resource "netbox_user" "test" {
          username = "{{.Name}}"
          password = "{{.Name}}-Passw0rd!"
        }
        resource "netbox_notification_group" "test" {
          name        = "{{.Name}}"
          description = "{{.Name}} updated"
          group_ids   = [netbox_user_group.test.id]
          user_ids    = [netbox_user.test.id]
        }

  # -------------------------------------------------------------- wireless
  wireless-lan-groups:
    test:
      basic: |
        resource "netbox_wireless_lan_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
      update: |
        resource "netbox_wireless_lan_group" "parent" {
          name = "{{.Name}}-parent"
          slug = "{{.Name}}-parent"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_wireless_lan_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          parent_id   = netbox_wireless_lan_group.parent.id
          description = "{{.Name}} updated"
          comments    = "Campus wireless groups"
          tags        = [netbox_tag.test.slug]
        }
  wireless-lans:
    test:
      basic: |
        resource "netbox_wireless_lan" "test" {
          ssid        = "{{.Name}}"
          description = "{{.Name}} created by acceptance test"
        }
      update: |
        resource "netbox_wireless_lan_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_vlan" "test" {
          name = "{{.Name}}"
          vid  = 1234
        }
        resource "netbox_tenant" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_wireless_lan" "test" {
          ssid        = "{{.Name}}"
          description = "{{.Name}} updated"
          group_id    = netbox_wireless_lan_group.test.id
          vlan_id     = netbox_vlan.test.id
          tenant_id   = netbox_tenant.test.id
          status      = "disabled"
          auth_type   = "wpa-personal"
          auth_cipher = "aes"
          auth_psk    = "{{.Name}}-psk"
          comments    = "Guest network"
          tags        = [netbox_tag.test.slug]
        }
  wireless-links:
    test:
      basic: |
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
        }
        resource "netbox_device_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device" "a" {
          name           = "{{.Name}}-a"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_device" "b" {
          name           = "{{.Name}}-b"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_interface" "a" {
          device_id = netbox_device.a.id
          name      = "wlan0"
          type      = "ieee802.11ax"
          rf_role   = "ap"
        }
        resource "netbox_interface" "b" {
          device_id = netbox_device.b.id
          name      = "wlan0"
          type      = "ieee802.11ax"
          rf_role   = "station"
        }
        resource "netbox_wireless_link" "test" {
          interface_a_id = netbox_interface.a.id
          interface_b_id = netbox_interface.b.id
          ssid           = "{{.Name}}"
        }
      update: |
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
        }
        resource "netbox_device_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tenant" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_device" "a" {
          name           = "{{.Name}}-a"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_device" "b" {
          name           = "{{.Name}}-b"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_interface" "a" {
          device_id = netbox_device.a.id
          name      = "wlan0"
          type      = "ieee802.11ax"
          rf_role   = "ap"
        }
        resource "netbox_interface" "b" {
          device_id = netbox_device.b.id
          name      = "wlan0"
          type      = "ieee802.11ax"
          rf_role   = "station"
        }
        resource "netbox_wireless_link" "test" {
          interface_a_id = netbox_interface.a.id
          interface_b_id = netbox_interface.b.id
          ssid           = "{{.Name}}"
          status         = "planned"
          tenant_id      = netbox_tenant.test.id
          auth_type      = "wpa-enterprise"
          auth_cipher    = "aes"
          distance       = 1.5
          distance_unit  = "km"
          description    = "{{.Name}} updated"
          comments       = "Point-to-point backhaul"
          tags           = [netbox_tag.test.slug]
        }
