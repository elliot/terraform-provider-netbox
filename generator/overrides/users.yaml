resources:
  users:
    lookups: [username]
    attributes:
      password: { sensitive: true }
  owners:
    attributes:
      # NetBox requires a group on every owner; group 1 stands for "no group".
      group:
        default: 1
        description: "ID of the Owner Group (`netbox_owner_group`). Group `1` means no group."
  tokens:
    attributes:
      # The secret is returned once, on create; keep it in state afterwards.
      token:
        expose: true
        sensitive: true
        description: "The token secret (v2: the part after the dot). Only returned by NetBox on creation; kept in state afterwards."
      key:
        expose: true
        description: "The v2 token identification key (`nbt_<key>`)."
