          description = "{{.Name}}"
        }
      update: |
        resource "netbox_vrf" "test" {
          name = "{{.Name}}"
        }
        resource "netbox_prefix" "test" {
          prefix      = "10.123.0.0/24"
          description = "{{.Name}} updated"
          vrf_id      = netbox_vrf.test.id
          status      = "reserved"
          is_pool     = true
        }
