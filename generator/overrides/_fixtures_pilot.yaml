# Acceptance-test fixtures for resources whose required attributes reference
# other objects. Keyed by API path segment. {{.Name}} is a unique tfacc- name.
resources:
  device-types:
    test:
      basic: |
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
          u_height        = 1
        }
      update: |
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
          u_height        = 2
          description     = "updated"
        }
