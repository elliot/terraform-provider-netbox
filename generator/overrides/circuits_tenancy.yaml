# Acceptance fixtures and tuning for the circuits and tenancy apps.
# Validated against https://demo.netbox.dev (NetBox 4.7); see
# docs/validation/circuits-tenancy.md for the outcome of every resource.
resources:
  # ---------------------------------------------------------------- circuits
  circuits:
    description: "Manages a NetBox circuit (`/api/circuits/circuits/`): a physical or virtual connection delivered by a provider, identified by its provider-assigned circuit ID (`cid`)."
    test:
      basic: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit" "test" {
          cid         = "{{.Name}}"
          provider_id = netbox_provider.test.id
          type_id     = netbox_circuit_type.test.id
          description = "{{.Name}}"
        }
      update: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_account" "test" {
          provider_id = netbox_provider.test.id
          account     = "{{.Name}}"
          name        = "{{.Name}}"
        }
        resource "netbox_tenant" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit" "test" {
          cid                 = "{{.Name}}"
          provider_id         = netbox_provider.test.id
          provider_account_id = netbox_provider_account.test.id
          type_id             = netbox_circuit_type.test.id
          tenant_id           = netbox_tenant.test.id
          status              = "active"
          install_date        = "2024-01-15"
          termination_date    = "2027-01-15"
          commit_rate         = 1000000
          distance            = 12.5
          distance_unit       = "km"
          description         = "{{.Name}} updated"
          comments            = "updated by acceptance test"
        }
  circuit-terminations:
    description: "Manages a NetBox circuit termination (`/api/circuits/circuit-terminations/`): the A or Z end of a circuit, attached to a site, location, region, site group or provider network."
    test:
      basic: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit" "test" {
          cid         = "{{.Name}}"
          provider_id = netbox_provider.test.id
          type_id     = netbox_circuit_type.test.id
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_termination" "test" {
          circuit_id       = netbox_circuit.test.id
          term_side        = "A"
          termination_type = "dcim.site"
          termination_id   = netbox_site.test.id
          description      = "{{.Name}}"
        }
      update: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit" "test" {
          cid         = "{{.Name}}"
          provider_id = netbox_provider.test.id
          type_id     = netbox_circuit_type.test.id
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_termination" "test" {
          circuit_id       = netbox_circuit.test.id
          term_side        = "A"
          termination_type = "dcim.site"
          termination_id   = netbox_site.test.id
          port_speed       = 1000000
          upstream_speed   = 500000
          xconnect_id      = "XC-{{.Name}}"
          pp_info          = "PP01 port 12"
          mark_connected   = true
          description      = "{{.Name}} updated"
        }
  circuit-group-assignments:
    description: "Manages a NetBox circuit group assignment (`/api/circuits/circuit-group-assignments/`): membership of a circuit or virtual circuit in a circuit group, with an optional priority."
    test:
      basic: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit" "test" {
          cid         = "{{.Name}}"
          provider_id = netbox_provider.test.id
          type_id     = netbox_circuit_type.test.id
        }
        resource "netbox_circuit_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_group_assignment" "test" {
          group_id    = netbox_circuit_group.test.id
          member_type = "circuits.circuit"
          member_id   = netbox_circuit.test.id
        }
      update: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit" "test" {
          cid         = "{{.Name}}"
          provider_id = netbox_provider.test.id
          type_id     = netbox_circuit_type.test.id
        }
        resource "netbox_circuit_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_group_assignment" "test" {
          group_id    = netbox_circuit_group.test.id
          member_type = "circuits.circuit"
          member_id   = netbox_circuit.test.id
          priority    = "primary"
        }
  circuit-groups:
    test:
      basic: |
        resource "netbox_circuit_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "{{.Name}}"
        }
      update: |
        resource "netbox_tenant" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          tenant_id   = netbox_tenant.test.id
          description = "{{.Name}} updated"
          comments    = "updated by acceptance test"
        }
  circuit-types:
    test:
      basic: |
        resource "netbox_circuit_type" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "{{.Name}}"
        }
      update: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_circuit_type" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          color       = "2196f3"
          description = "{{.Name}} updated"
          tags        = [netbox_tag.test.slug]
        }
  provider-accounts:
    description: "Manages a NetBox provider account (`/api/circuits/provider-accounts/`): a billing or service account held with a circuit provider."
    test:
      basic: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_account" "test" {
          provider_id = netbox_provider.test.id
          account     = "{{.Name}}"
        }
      update: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_account" "test" {
          provider_id = netbox_provider.test.id
          account     = "{{.Name}}"
          name        = "{{.Name}} billing"
          description = "{{.Name}} updated"
          comments    = "updated by acceptance test"
        }
  provider-networks:
    description: "Manages a NetBox provider network (`/api/circuits/provider-networks/`): an opaque network operated by a provider (MPLS cloud, internet exchange, ...) to which circuits can terminate."
    test:
      basic: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_network" "test" {
          provider_id = netbox_provider.test.id
          name        = "{{.Name}}"
        }
      update: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_network" "test" {
          provider_id = netbox_provider.test.id
          name        = "{{.Name}}"
          service_id  = "SVC-{{.Name}}"
          description = "{{.Name}} updated"
          comments    = "updated by acceptance test"
        }
  virtual-circuits:
    description: "Manages a NetBox virtual circuit (`/api/circuits/virtual-circuits/`): a logical connection carried over a provider network, terminated on virtual interfaces."
    test:
      basic: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_network" "test" {
          provider_id = netbox_provider.test.id
          name        = "{{.Name}}"
        }
        resource "netbox_virtual_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_virtual_circuit" "test" {
          cid                 = "{{.Name}}"
          provider_network_id = netbox_provider_network.test.id
          type_id             = netbox_virtual_circuit_type.test.id
        }
      update: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_network" "test" {
          provider_id = netbox_provider.test.id
          name        = "{{.Name}}"
        }
        resource "netbox_provider_account" "test" {
          provider_id = netbox_provider.test.id
          account     = "{{.Name}}"
        }
        resource "netbox_virtual_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tenant" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_virtual_circuit" "test" {
          cid                 = "{{.Name}}"
          provider_network_id = netbox_provider_network.test.id
          provider_account_id = netbox_provider_account.test.id
          type_id             = netbox_virtual_circuit_type.test.id
          tenant_id           = netbox_tenant.test.id
          status              = "planned"
          description         = "{{.Name}} updated"
          comments            = "updated by acceptance test"
        }
  virtual-circuit-terminations:
    description: "Manages a NetBox virtual circuit termination (`/api/circuits/virtual-circuit-terminations/`): attaches a virtual circuit to a device interface as a peer, hub or spoke."
    test:
      basic: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_network" "test" {
          provider_id = netbox_provider.test.id
          name        = "{{.Name}}"
        }
        resource "netbox_virtual_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_virtual_circuit" "test" {
          cid                 = "{{.Name}}"
          provider_network_id = netbox_provider_network.test.id
          type_id             = netbox_virtual_circuit_type.test.id
        }
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
        }
        resource "netbox_device_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device" "test" {
          name           = "{{.Name}}"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_interface" "test" {
          device_id = netbox_device.test.id
          name      = "{{.Name}}"
          type      = "virtual"
        }
        resource "netbox_virtual_circuit_termination" "test" {
          virtual_circuit_id = netbox_virtual_circuit.test.id
          interface_id       = netbox_interface.test.id
          role               = "peer"
          description        = "{{.Name}}"
        }
      update: |
        resource "netbox_provider" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_provider_network" "test" {
          provider_id = netbox_provider.test.id
          name        = "{{.Name}}"
        }
        resource "netbox_virtual_circuit_type" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_virtual_circuit" "test" {
          cid                 = "{{.Name}}"
          provider_network_id = netbox_provider_network.test.id
          type_id             = netbox_virtual_circuit_type.test.id
        }
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
        }
        resource "netbox_device_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device" "test" {
          name           = "{{.Name}}"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_interface" "test" {
          device_id = netbox_device.test.id
          name      = "{{.Name}}"
          type      = "virtual"
        }
        resource "netbox_virtual_circuit_termination" "test" {
          virtual_circuit_id = netbox_virtual_circuit.test.id
          interface_id       = netbox_interface.test.id
          role               = "hub"
          description        = "{{.Name}} updated"
        }
  # ----------------------------------------------------------------- tenancy
  tenants:
    test:
      basic: |
        resource "netbox_tenant" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "{{.Name}}"
        }
      update: |
        resource "netbox_tenant_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tenant" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          group_id    = netbox_tenant_group.test.id
          description = "{{.Name}} updated"
          comments    = "updated by acceptance test"
          tags        = [netbox_tag.test.slug]
        }
  tenant-groups:
    test:
      basic: |
        resource "netbox_tenant_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "{{.Name}}"
        }
      update: |
        resource "netbox_tenant_group" "parent" {
          name = "{{.Name}}-parent"
          slug = "{{.Name}}-parent"
        }
        resource "netbox_tenant_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          parent_id   = netbox_tenant_group.parent.id
          description = "{{.Name}} updated"
        }
  contacts:
    test:
      basic: |
        resource "netbox_contact" "test" {
          name        = "{{.Name}}"
          description = "{{.Name}}"
        }
      update: |
        resource "netbox_contact_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_contact" "test" {
          name        = "{{.Name}}"
          group_ids   = [netbox_contact_group.test.id]
          title       = "Network Operations"
          phone       = "+1 555 0100"
          email       = "{{.Name}}@example.com"
          address     = "1 Example Street"
          link        = "https://example.com/{{.Name}}"
          description = "{{.Name}} updated"
          comments    = "updated by acceptance test"
        }
  contact-groups:
    test:
      basic: |
        resource "netbox_contact_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "{{.Name}}"
        }
      update: |
        resource "netbox_contact_group" "parent" {
          name = "{{.Name}}-parent"
          slug = "{{.Name}}-parent"
        }
        resource "netbox_contact_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          parent_id   = netbox_contact_group.parent.id
          description = "{{.Name}} updated"
        }
  contact-assignments:
    description: "Manages a NetBox contact assignment (`/api/tenancy/contact-assignments/`): links a contact, optionally with a role and priority, to any object that supports contacts (site, device, circuit, ...)."
    test:
      basic: |
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_contact" "test" {
          name = "{{.Name}}"
        }
        resource "netbox_contact_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_contact_assignment" "test" {
          object_type = "dcim.site"
          object_id   = netbox_site.test.id
          contact_id  = netbox_contact.test.id
          role_id     = netbox_contact_role.test.id
        }
      update: |
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_contact" "test" {
          name = "{{.Name}}"
        }
        resource "netbox_contact_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_contact_assignment" "test" {
          object_type = "dcim.site"
          object_id   = netbox_site.test.id
          contact_id  = netbox_contact.test.id
          role_id     = netbox_contact_role.test.id
          priority    = "primary"
        }
