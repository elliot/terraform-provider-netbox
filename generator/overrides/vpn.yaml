# VPN app (ike/ipsec crypto, tunnels, L2VPN): acceptance fixtures and tuning.
# Validated against https://demo.netbox.dev (NetBox 4.7); see docs/validation/vpn.md.
#
# NetBox rules the fixtures respect:
#   * ike_proposal: authentication_algorithm is mandatory unless the cipher is AEAD (*-gcm);
#     NetBox rejects null/"" for it on PATCH ("This field may not be blank."), so it is always set.
#   * ike_policy: version is required; mode is required for IKEv1 and forbidden for IKEv2.
#   * ipsec_proposal: encryption and/or authentication algorithm must be set.
#   * tunnel: status is required by the API although the OpenAPI document lists it as optional.
#   * tunnel_termination: role is required by the API although the OpenAPI document lists it as optional.
resources:
  ike-proposals:
    test:
      basic: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_ike_proposal" "test" {
          name                     = "{{.Name}}"
          description              = "created by acceptance test"
          authentication_method    = "preshared-keys"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
          group                    = 14
          sa_lifetime              = 86400
          tags                     = [netbox_tag.test.slug]
        }
      update: |
        resource "netbox_ike_proposal" "test" {
          name                     = "{{.Name}}"
          description              = "updated by acceptance test"
          authentication_method    = "certificates"
          encryption_algorithm     = "aes-256-gcm"
          authentication_algorithm = "hmac-sha384"
          group                    = 19
          sa_lifetime              = 28800
          comments                 = "phase 1 proposal"
        }
      checks:
        group: "14"
        authentication_algorithm: hmac-sha256
  ike-policies:
    test:
      basic: |
        resource "netbox_ike_proposal" "a" {
          name                     = "{{.Name}}-a"
          authentication_method    = "preshared-keys"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
          group                    = 14
        }
        resource "netbox_ike_proposal" "b" {
          name                     = "{{.Name}}-b"
          authentication_method    = "preshared-keys"
          encryption_algorithm     = "aes-128-cbc"
          authentication_algorithm = "hmac-sha1"
          group                    = 2
        }
        resource "netbox_ike_policy" "test" {
          name          = "{{.Name}}"
          description   = "created by acceptance test"
          version       = 1
          mode          = "main"
          proposal_ids  = [netbox_ike_proposal.a.id]
          preshared_key = "{{.Name}}-psk"
        }
      update: |
        resource "netbox_ike_proposal" "a" {
          name                     = "{{.Name}}-a"
          authentication_method    = "preshared-keys"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
          group                    = 14
        }
        resource "netbox_ike_proposal" "b" {
          name                     = "{{.Name}}-b"
          authentication_method    = "preshared-keys"
          encryption_algorithm     = "aes-128-cbc"
          authentication_algorithm = "hmac-sha1"
          group                    = 2
        }
        resource "netbox_ike_policy" "test" {
          name          = "{{.Name}}"
          description   = "updated by acceptance test"
          version       = 1
          mode          = "aggressive"
          proposal_ids  = [netbox_ike_proposal.a.id, netbox_ike_proposal.b.id]
          preshared_key = "{{.Name}}-psk-rotated"
          comments      = "IKEv1 policy"
        }
      checks:
        version: "1"
        mode: main
        proposal_ids.#: "1"
  ipsec-proposals:
    test:
      basic: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_ipsec_proposal" "test" {
          name                     = "{{.Name}}"
          description              = "created by acceptance test"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
          sa_lifetime_seconds      = 3600
          tags                     = [netbox_tag.test.slug]
        }
      update: |
        resource "netbox_ipsec_proposal" "test" {
          name                     = "{{.Name}}"
          description              = "updated by acceptance test"
          encryption_algorithm     = "aes-128-cbc"
          authentication_algorithm = "hmac-sha512"
          sa_lifetime_seconds      = 7200
          sa_lifetime_data         = 4608000
          comments                 = "phase 2 proposal"
        }
      checks:
        sa_lifetime_seconds: "3600"
  ipsec-policies:
    test:
      basic: |
        resource "netbox_ipsec_proposal" "a" {
          name                     = "{{.Name}}-a"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
        }
        resource "netbox_ipsec_proposal" "b" {
          name                     = "{{.Name}}-b"
          encryption_algorithm     = "aes-128-cbc"
          authentication_algorithm = "hmac-sha1"
        }
        resource "netbox_ipsec_policy" "test" {
          name         = "{{.Name}}"
          description  = "created by acceptance test"
          proposal_ids = [netbox_ipsec_proposal.a.id]
          pfs_group    = 14
        }
      update: |
        resource "netbox_ipsec_proposal" "a" {
          name                     = "{{.Name}}-a"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
        }
        resource "netbox_ipsec_proposal" "b" {
          name                     = "{{.Name}}-b"
          encryption_algorithm     = "aes-128-cbc"
          authentication_algorithm = "hmac-sha1"
        }
        resource "netbox_ipsec_policy" "test" {
          name         = "{{.Name}}"
          description  = "updated by acceptance test"
          proposal_ids = [netbox_ipsec_proposal.a.id, netbox_ipsec_proposal.b.id]
          pfs_group    = 19
          comments     = "phase 2 policy"
        }
      checks:
        pfs_group: "14"
  ipsec-profiles:
    test:
      basic: |
        resource "netbox_ike_proposal" "test" {
          name                     = "{{.Name}}"
          authentication_method    = "preshared-keys"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
          group                    = 14
        }
        resource "netbox_ike_policy" "test" {
          name         = "{{.Name}}"
          version      = 1
          mode         = "main"
          proposal_ids = [netbox_ike_proposal.test.id]
        }
        resource "netbox_ipsec_proposal" "test" {
          name                     = "{{.Name}}"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
        }
        resource "netbox_ipsec_policy" "test" {
          name         = "{{.Name}}"
          proposal_ids = [netbox_ipsec_proposal.test.id]
          pfs_group    = 14
        }
        resource "netbox_ipsec_profile" "test" {
          name            = "{{.Name}}"
          description     = "created by acceptance test"
          mode            = "esp"
          ike_policy_id   = netbox_ike_policy.test.id
          ipsec_policy_id = netbox_ipsec_policy.test.id
        }
      update: |
        resource "netbox_ike_proposal" "test" {
          name                     = "{{.Name}}"
          authentication_method    = "preshared-keys"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
          group                    = 14
        }
        resource "netbox_ike_policy" "test" {
          name         = "{{.Name}}"
          version      = 1
          mode         = "main"
          proposal_ids = [netbox_ike_proposal.test.id]
        }
        resource "netbox_ipsec_proposal" "test" {
          name                     = "{{.Name}}"
          encryption_algorithm     = "aes-256-cbc"
          authentication_algorithm = "hmac-sha256"
        }
        resource "netbox_ipsec_policy" "test" {
          name         = "{{.Name}}"
          proposal_ids = [netbox_ipsec_proposal.test.id]
          pfs_group    = 14
        }
        resource "netbox_ipsec_profile" "test" {
          name            = "{{.Name}}"
          description     = "updated by acceptance test"
          mode            = "ah"
          ike_policy_id   = netbox_ike_policy.test.id
          ipsec_policy_id = netbox_ipsec_policy.test.id
          comments        = "site-to-site profile"
        }
      checks:
        mode: esp
  tunnel-groups:
    test:
      basic: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_tunnel_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "created by acceptance test"
          tags        = [netbox_tag.test.slug]
        }
      update: |
        resource "netbox_tunnel_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "updated by acceptance test"
          comments    = "hub-and-spoke overlay"
        }
  tunnels:
    test:
      basic: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_tunnel_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tunnel" "test" {
          name          = "{{.Name}}"
          description   = "created by acceptance test"
          status        = "planned"
          encapsulation = "gre"
          group_id      = netbox_tunnel_group.test.id
          tunnel_id     = 100
          tags          = [netbox_tag.test.slug]
        }
      update: |
        resource "netbox_tunnel_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tunnel" "test" {
          name          = "{{.Name}}"
          description   = "updated by acceptance test"
          status        = "active"
          encapsulation = "ipsec-tunnel"
          group_id      = netbox_tunnel_group.test.id
          tunnel_id     = 101
          comments      = "branch uplink"
        }
      checks:
        status: planned
        encapsulation: gre
  tunnel-terminations:
    test:
      basic: |
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
        }
        resource "netbox_device_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device" "test" {
          name           = "{{.Name}}"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_interface" "wan" {
          device_id = netbox_device.test.id
          name      = "eth0"
          type      = "1000base-t"
        }
        resource "netbox_interface" "tun" {
          device_id = netbox_device.test.id
          name      = "tun0"
          type      = "virtual"
        }
        resource "netbox_ip_address" "outside" {
          address              = "203.0.113.10/24"
          description          = "{{.Name}}"
          assigned_object_type = "dcim.interface"
          assigned_object_id   = netbox_interface.wan.id
        }
        resource "netbox_tunnel" "test" {
          name          = "{{.Name}}"
          status        = "active"
          encapsulation = "ipsec-tunnel"
        }
        resource "netbox_tunnel_termination" "test" {
          tunnel_id        = netbox_tunnel.test.id
          role             = "hub"
          termination_type = "dcim.interface"
          termination_id   = netbox_interface.tun.id
        }
      update: |
        resource "netbox_manufacturer" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device_type" "test" {
          manufacturer_id = netbox_manufacturer.test.id
          model           = "{{.Name}}"
          slug            = "{{.Name}}"
        }
        resource "netbox_device_role" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_device" "test" {
          name           = "{{.Name}}"
          device_type_id = netbox_device_type.test.id
          role_id        = netbox_device_role.test.id
          site_id        = netbox_site.test.id
        }
        resource "netbox_interface" "wan" {
          device_id = netbox_device.test.id
          name      = "eth0"
          type      = "1000base-t"
        }
        resource "netbox_interface" "tun" {
          device_id = netbox_device.test.id
          name      = "tun0"
          type      = "virtual"
        }
        resource "netbox_ip_address" "outside" {
          address              = "203.0.113.10/24"
          description          = "{{.Name}}"
          assigned_object_type = "dcim.interface"
          assigned_object_id   = netbox_interface.wan.id
        }
        resource "netbox_tunnel" "test" {
          name          = "{{.Name}}"
          status        = "active"
          encapsulation = "ipsec-tunnel"
        }
        resource "netbox_tunnel_termination" "test" {
          tunnel_id        = netbox_tunnel.test.id
          role             = "peer"
          termination_type = "dcim.interface"
          termination_id   = netbox_interface.tun.id
          outside_ip_id    = netbox_ip_address.outside.id
        }
      checks:
        role: hub
        termination_type: dcim.interface
  l2vpns:
    test:
      basic: |
        resource "netbox_route_target" "import" {
          name = "65000:{{.Name}}"
        }
        resource "netbox_route_target" "export" {
          name = "65001:{{.Name}}"
        }
        resource "netbox_l2vpn" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          description = "created by acceptance test"
          type        = "vxlan"
          identifier  = 100100
          status      = "planned"
        }
      update: |
        resource "netbox_route_target" "import" {
          name = "65000:{{.Name}}"
        }
        resource "netbox_route_target" "export" {
          name = "65001:{{.Name}}"
        }
        resource "netbox_l2vpn" "test" {
          name              = "{{.Name}}"
          slug              = "{{.Name}}"
          description       = "updated by acceptance test"
          type              = "vxlan-evpn"
          identifier        = 100200
          status            = "active"
          import_target_ids = [netbox_route_target.import.id]
          export_target_ids = [netbox_route_target.export.id]
          comments          = "tenant overlay"
        }
      checks:
        type: vxlan
        status: planned
  l2vpn-terminations:
    test:
      basic: |
        resource "netbox_l2vpn" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
          type = "vxlan"
        }
        resource "netbox_vlan" "a" {
          name = "{{.Name}}-a"
          vid  = 2001
        }
        resource "netbox_vlan" "b" {
          name = "{{.Name}}-b"
          vid  = 2002
        }
        resource "netbox_l2vpn_termination" "test" {
          l2vpn_id             = netbox_l2vpn.test.id
          assigned_object_type = "ipam.vlan"
          assigned_object_id   = netbox_vlan.a.id
        }
      update: |
        resource "netbox_tag" "test" {
          name = "{{.Name}}-tag"
          slug = "{{.Name}}-tag"
        }
        resource "netbox_l2vpn" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
          type = "vxlan"
        }
        resource "netbox_vlan" "a" {
          name = "{{.Name}}-a"
          vid  = 2001
        }
        resource "netbox_vlan" "b" {
          name = "{{.Name}}-b"
          vid  = 2002
        }
        resource "netbox_l2vpn_termination" "test" {
          l2vpn_id             = netbox_l2vpn.test.id
          assigned_object_type = "ipam.vlan"
          assigned_object_id   = netbox_vlan.b.id
          tags                 = [netbox_tag.test.slug]
        }
      checks:
        assigned_object_type: ipam.vlan
