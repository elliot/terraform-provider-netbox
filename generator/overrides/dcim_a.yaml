# Acceptance-test fixtures and tuning for the "dcim, part A" shard (sites,
# racks, power, cooling, manufacturers/platforms/roles, misc). Keyed by API
# path segment; merged after dcim.yaml. {{.Name}} is a unique tfacc- name.
resources:
  regions:
    test:
      basic: |
        resource "netbox_region" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
      update: |
        resource "netbox_region" "parent" {
          name = "{{.Name}}-parent"
          slug = "{{.Name}}-parent"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_region" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          parent_id   = netbox_region.parent.id
          description = "{{.Name}} updated"
          comments    = "updated by acceptance test"
          tags        = [netbox_tag.test.slug]
        }

  site-groups:
    test:
      basic: |
        resource "netbox_site_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
      update: |
        resource "netbox_site_group" "parent" {
          name = "{{.Name}}-parent"
          slug = "{{.Name}}-parent"
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site_group" "test" {
          name        = "{{.Name}}"
          slug        = "{{.Name}}"
          parent_id   = netbox_site_group.parent.id
          description = "{{.Name}} updated"
          comments    = "updated by acceptance test"
          tags        = [netbox_tag.test.slug]
        }

  sites:
    test:
      basic: |
        resource "netbox_site" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
      update: |
        resource "netbox_region" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site_group" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_tenant" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_rir" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_asn" "test" {
          asn         = 4200000001
          rir_id      = netbox_rir.test.id
          description = "{{.Name}}"
          # netbox_asn.site_ids mirrors netbox_site.asn_ids; the site owns the link here.
          lifecycle { ignore_changes = [site_ids] }
        }
        resource "netbox_tag" "test" {
          name = "{{.Name}}"
          slug = "{{.Name}}"
        }
        resource "netbox_site" "test" {
          name             = "{{.Name}}"
          slug             = "{{.Name}}"
          status           = "planned"
          region_id        = netbox_region.test.id
          group_id         = netbox_site_group.test.id
          tenant_id        = netbox_tenant.test.id
          facility         = "DC-{{.Name}}"
          time_zone        = "Europe/Berlin"
          description      = "{{.Name}} updated"
          physical_address = "1 Example Street, Berlin"
          shipping_address = "1 Example Street, Berlin (loading dock)"
          latitude         = 52.520008
          longitude        = 13.404954
          comments         = "updated by acceptance test"
          asn_ids          = [netbox_asn.test.id]
          tags             = [netbox_tag.test.slug]
        }
      checks:
        status: active

