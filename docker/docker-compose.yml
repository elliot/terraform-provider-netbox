# Local / CI NetBox 4.7 for acceptance tests.
#
#   docker compose -f docker/docker-compose.yml up -d --wait
#   NetBox: http://localhost:8000  (superuser: admin / admin, see below)
#
# See docker/README.md for how to obtain a v2 API token (nbt_<key>.<secret>).
name: tfnetbox

x-netbox: &netbox
  image: docker.io/netboxcommunity/netbox:${NETBOX_IMAGE_TAG:-v4.7}
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  environment: &netbox-env
    ALLOWED_HOSTS: "*"
    CORS_ORIGIN_ALLOW_ALL: "true"
    DB_HOST: postgres
    DB_NAME: netbox
    DB_USER: netbox
    DB_PASSWORD: netbox
    REDIS_HOST: valkey
    REDIS_PORT: "6379"
    REDIS_DATABASE: "0"
    REDIS_SSL: "false"
    REDIS_CACHE_HOST: valkey
    REDIS_CACHE_PORT: "6379"
    REDIS_CACHE_DATABASE: "1"
    REDIS_CACHE_SSL: "false"
    SECRET_KEY: "r(m)9nLGnz$(_q3N-2Nw4ZWr9bHfQx7FBnqoeEwZvuvHX7HTF1i0BUXe1tfacc-only"
    SKIP_SUPERUSER: "false"
    SUPERUSER_NAME: ${SUPERUSER_NAME:-admin}
    SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@example.com}
    SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-admin}
    # Legacy (v1) token created by the entrypoint. The provider does NOT
    # accept it; provision a v2 token as described in docker/README.md.
    SUPERUSER_API_TOKEN: ${SUPERUSER_API_TOKEN:-0123456789abcdef0123456789abcdef01234567}
    # Keep the demo-like throttle off so acceptance tests are not rate-limited
    # by the server; the provider's own limiter is what is under test.
    LOGIN_REQUIRED: "false"
    METRICS_ENABLED: "false"
    RELEASE_CHECK_URL: ""
    HOUSEKEEPING_INTERVAL: "86400"

services:
  netbox:
    <<: *netbox
    ports:
      - "${NETBOX_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login/ || exit 1"]
      start_period: 300s
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - netbox-media:/opt/netbox/netbox/media:rw
      - netbox-reports:/opt/netbox/netbox/reports:rw
      - netbox-scripts:/opt/netbox/netbox/scripts:rw

  netbox-worker:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command: /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py rqworker
    healthcheck:
      test: ["CMD-SHELL", "ps -aux | grep -v grep | grep -q rqworker || exit 1"]
      start_period: 40s
      interval: 15s
      timeout: 3s
      retries: 3

  netbox-housekeeping:
    <<: *netbox
    depends_on:
      netbox:
        condition: service_healthy
    command: /opt/netbox/housekeeping.sh
    healthcheck:
      test: ["CMD-SHELL", "ps -aux | grep -v grep | grep -q housekeeping || exit 1"]
      start_period: 40s
      interval: 15s
      timeout: 3s
      retries: 3

  postgres:
    image: docker.io/postgres:18-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - netbox-postgres:/var/lib/postgresql

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - netbox-valkey:/data

volumes:
  netbox-media:
  netbox-reports:
  netbox-scripts:
  netbox-postgres:
  netbox-valkey:
