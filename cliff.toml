# git-cliff configuration (https://git-cliff.org/docs/configuration).
#
# git-cliff only drafts the entries for the next release: scripts/prepare-release.sh
# renders the commits since the last tag with `--unreleased --strip all` and
# tools/changelog merges them into CHANGELOG.md, which stays the hand-edited
# source of truth. Edit the wording in the release pull request before merging.
#
# PRs are squash-merged, so each entry is one PR title (a Conventional Commit
# subject, enforced by .github/workflows/pr-title.yml).

[changelog]
# The body renders only the "### Group" blocks; tools/changelog adds the version
# heading and puts the groups in Keep a Changelog order.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking and commit.group is not containing("Breaking") %}**Breaking:** {% endif %}\
{% if commit.scope %}`{{ commit.scope }}`: {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Drop every commit that no parser below assigns to a group.
filter_commits = true
# Breaking changes are listed even for types that are otherwise skipped.
protect_breaking_commits = true
split_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"

commit_preprocessors = [
  # "(#12)" appended by the squash merge becomes a link to the pull request.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/elliot/terraform-provider-netbox/pull/${1}))" },
]

# First match wins. The HTML comments only order the groups and are stripped.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^[a-z]+\\(security\\)", group = "<!-- 6 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  # Renovate: Go module updates ship in the binary, action digests do not.
  { message = "^fix\\(deps\\)", group = "<!-- 2 -->Changed" },
  { message = "^fix", group = "<!-- 5 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 2 -->Changed" },
  # docs, ci, test, build, chore, refactor and style are internal: not listed.
]

[bump]
# Pre-1.0: a feature or a breaking change bumps the minor version, a fix the patch.
features_always_bump_minor = true
breaking_always_bump_major = false
