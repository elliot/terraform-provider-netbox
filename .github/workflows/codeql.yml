name: CodeQL

# Code scanning for the Go sources: the hand-written packages and the generated
# resources in internal/provider/gen. The workflows themselves are scanned by
# codeql-actions.yml. Results appear under Security -> Code scanning.
#
# The generated API client in netbox/ (1M lines of openapi-generator output) is
# not scanned. The Go extractor fully extracts every package under the checkout
# whatever its module, and ignores paths-ignore, so the client alone took about
# 40 minutes. It is moved out of the checkout before the build and treated as an
# external dependency: only its types are extracted (about 10 minutes in all).
# This also leaves out the hand-written netbox/client_extra.go, which shares the
# package; moving those helpers out of netbox/ would bring them back in scope.
#
# Runs on every pull request so the CodeQL check always has a /language:go
# analysis to compare with main (without one it reports "1 configuration not
# found"). Pushes to main only run when Go sources or modules change; the weekly
# run picks up new queries against unchanged code.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly, Monday 04:23 UTC, so new queries run against unchanged code too.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # check out the repository
      security-events: write # upload code scanning results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Move the generated client out of the scanned tree
        # Replaces ./netbox with a copy outside the checkout, as a separate
        # module, so the extractor only reads its types. The client imports only
        # the standard library, so the new module needs no go.sum entries.
        run: |
          mod="$(go list -m)/netbox"
          mv netbox "$RUNNER_TEMP/netbox"
          printf 'module %s\n\ngo %s\n' "$mod" "$(go mod edit -json | jq -r .Go)" > "$RUNNER_TEMP/netbox/go.mod"
          go mod edit -require="$mod@v0.0.0" -replace="$mod=$RUNNER_TEMP/netbox"
      - name: Restore Go cache
        # Written by the Build & lint job in test.yml on pushes to main. Saves
        # the compile inside the traced build; extraction is unaffected because
        # the tracer hooks the go command, not the compiler.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-build-
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
          queries: security-and-quality
      - name: Build
        run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
