name: Acceptance tests

on:
  workflow_dispatch:
    inputs:
      shard:
        description: "Go package pattern to test (overrides the matrix, e.g. ./internal/provider/gen/dcim/)"
        required: false
        default: ""
      terraform:
        description: "Terraform version"
        required: false
        default: "1.17.*"
      netbox_image_tag:
        description: "netboxcommunity/netbox image tag, e.g. v4.7.2 (empty: the docker-compose.yml default)"
        required: false
        default: ""
      upgrade_from:
        description: "Released provider version the upgrade tests start from (latest: newest on the registry, none: skip them)"
        required: false
        default: "latest"
  # Called by netbox-watch.yml to test a release tag against a new NetBox image.
  workflow_call:
    inputs:
      shard:
        type: string
        required: false
        default: ""
      terraform:
        type: string
        required: false
        default: "1.17.*"
      netbox_image_tag:
        type: string
        required: false
        default: ""
      ref:
        description: "Git ref to check out and test (empty: the calling commit)"
        type: string
        required: false
        default: ""
      upgrade_from:
        description: "Released provider version the upgrade tests start from (latest, none or X.Y.Z)"
        type: string
        required: false
        default: "none"
  schedule:
    # Nightly at 03:17 UTC.
    - cron: "17 3 * * *"
  # On PRs the job only runs when the PR carries the `run-acceptance` label; the
  # `labeled` type makes adding the label start the run on an existing PR.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

# Twelve NetBox stacks per run, so never let re-pushes to the same branch pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NETBOX_SUPERUSER_NAME: admin
  NETBOX_SUPERUSER_PASSWORD: admin-tfacc-password

jobs:
  acceptance:
    name: ${{ matrix.shard }}
    # Scheduled and manual runs always go ahead; PRs need the `run-acceptance` label.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-acceptance')
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    # 120 minutes of acceptance tests plus up to 45 of upgrade tests.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One shard per Go package (NetBox app); each job runs its own NetBox.
        shard:
          - ./internal/provider/
          - ./internal/provider/gen/dcim/
          - ./internal/provider/gen/ipam/
          - ./internal/provider/gen/extras/
          - ./internal/provider/gen/circuits/
          - ./internal/provider/gen/vpn/
          - ./internal/provider/gen/virtualization/
          - ./internal/provider/gen/tenancy/
          - ./internal/provider/gen/users/
          - ./internal/provider/gen/wireless/
          - ./internal/provider/gen/core/
          - ./internal/provider/manual/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        # Written by the Build & lint job in test.yml on pushes to main.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-build-
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform || '1.17.*' }}
          terraform_wrapper: false

      - name: Start NetBox
        env:
          # Empty selects the default tag in docker/docker-compose.yml.
          NETBOX_IMAGE_TAG: ${{ inputs.netbox_image_tag }}
          SUPERUSER_NAME: ${{ env.NETBOX_SUPERUSER_NAME }}
          SUPERUSER_PASSWORD: ${{ env.NETBOX_SUPERUSER_PASSWORD }}
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 600

      - name: Provision a v2 API token
        id: token
        run: |
          set -euo pipefail
          resp=$(curl -sS -f -X POST http://localhost:8000/api/users/tokens/provision/ \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            -d "{\"username\":\"${NETBOX_SUPERUSER_NAME}\",\"password\":\"${NETBOX_SUPERUSER_PASSWORD}\",\"version\":2,\"write_enabled\":true,\"description\":\"github-actions\"}")
          key=$(echo "$resp" | jq -r '.key')
          secret=$(echo "$resp" | jq -r '.token')
          token="nbt_${key#nbt_}.${secret}"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Report the NetBox version
        # Floating image tags (v4.7) move with every patch release; record which
        # release this run actually tested.
        env:
          NETBOX_API_TOKEN: ${{ steps.token.outputs.token }}
          ACC_SHARD: ${{ inputs.shard || matrix.shard }}
        run: |
          set -euo pipefail
          version=$(curl -sS -f http://localhost:8000/api/status/ \
            -H "Authorization: Bearer $NETBOX_API_TOKEN" -H 'Accept: application/json' | jq -r '."netbox-version"')
          echo "::notice title=NetBox version::$ACC_SHARD ran against NetBox $version"
          echo "NetBox \`$version\` for \`$ACC_SHARD\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          NETBOX_SERVER_URL: http://localhost:8000
          NETBOX_API_TOKEN: ${{ steps.token.outputs.token }}
          NETBOX_REQUESTS_PER_SECOND: "10"
          ACC_SHARD: ${{ inputs.shard || matrix.shard }}
        run: go test "$ACC_SHARD" -v -count=1 -run TestAcc -timeout 120m -parallel 4

      - name: Resolve the upgrade baseline
        id: upgrade
        # Also after failed acceptance tests; scheduled and PR runs have no
        # inputs and start from the latest release.
        if: ${{ !cancelled() && steps.token.outcome == 'success' }}
        env:
          UPGRADE_FROM: ${{ inputs.upgrade_from || 'latest' }}
        run: |
          set -euo pipefail
          case "$UPGRADE_FROM" in
            none) echo "Upgrade tests disabled"; exit 0 ;;
            latest) UPGRADE_FROM=$(curl -sS -f --retry 3 https://registry.terraform.io/v1/providers/elliot/netbox | jq -r '.version') ;;
          esac
          if ! [[ "$UPGRADE_FROM" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::upgrade_from must be latest, none or a version such as 1.0.0"
            exit 1
          fi
          echo "version=$UPGRADE_FROM" >> "$GITHUB_OUTPUT"

      - name: Run upgrade tests
        # Applies each fixture with the release from the registry, then expects
        # an empty plan from this build (docs/GENERATOR.md, Upgrade tests). Runs
        # against the same NetBox even when the acceptance tests failed.
        if: ${{ !cancelled() && steps.upgrade.outputs.version != '' }}
        env:
          TF_ACC: "1"
          NETBOX_SERVER_URL: http://localhost:8000
          NETBOX_API_TOKEN: ${{ steps.token.outputs.token }}
          NETBOX_REQUESTS_PER_SECOND: "10"
          NETBOX_UPGRADE_FROM: ${{ steps.upgrade.outputs.version }}
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/plugin-cache
          ACC_SHARD: ${{ inputs.shard || matrix.shard }}
        run: |
          set -uo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          go test "$ACC_SHARD" -v -count=1 -run 'TestAcc.*_upgrade$' -timeout 45m -parallel 4 2>&1 | tee "$RUNNER_TEMP/upgrade.log"
          status=$?
          log="$RUNNER_TEMP/upgrade.log"
          pass=$(grep -cE -- '--- PASS: TestAcc[A-Za-z0-9]+_upgrade' "$log" || true)
          fail=$(grep -cE -- '--- FAIL: TestAcc[A-Za-z0-9]+_upgrade' "$log" || true)
          skip=$(grep -cE -- '--- SKIP: TestAcc[A-Za-z0-9]+_upgrade' "$log" || true)
          {
            echo "### Upgrade from \`$NETBOX_UPGRADE_FROM\` for \`$ACC_SHARD\`"
            echo ""
            echo "$pass passed, $fail failed, $skip skipped"
            if [ "$fail" -gt 0 ]; then
              echo ""
              echo "Failed:"
              grep -oE -- '--- FAIL: TestAcc[A-Za-z0-9]+_upgrade' "$log" | sed 's/^--- FAIL: /- /'
            fi
            if [ "$skip" -gt 0 ]; then
              echo ""
              echo "<details><summary>Skipped</summary>"
              echo ""
              # go test -v prints a skipped test's reason just before its "--- SKIP" line.
              awk '/^ +[a-z_]+_test\.go:[0-9]+: / { reason=$0; sub(/^ +[a-z_]+_test\.go:[0-9]+: /, "", reason) }
                   /^--- SKIP: TestAcc[A-Za-z0-9]+_upgrade/ { print "- " $3 ": " reason; reason="" }' "$log"
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: NetBox logs (on failure)
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color netbox | tail -n 500

      - name: Stop NetBox
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
