# Publishes a GitHub Release whenever a v* tag is pushed and refreshes the
# provider network mirror on GitHub Pages (docs/INSTALL.md).
#
# The build job runs in the `release` deployment environment. Keep release
# secrets there (not at repository level) so no other workflow can read them,
# and protect the environment with a required reviewer and a v* tag rule
# (docs/SECURITY.md).
#
# Optional `release` environment secrets:
#   GPG_PRIVATE_KEY, PASSPHRASE   sign the checksum file (needed only by the public
#                                 Terraform Registry). Without them the release is
#                                 built unsigned and remains installable through the
#                                 mirror, scripts/install.sh or a filesystem mirror.
#
# Every release zip, checksum file and manifest also gets a Sigstore build
# provenance attestation (`gh attestation verify <zip> --repo <owner>/<repo>`).
# Optional repository variables:
#   MIRROR_URL       public URL of the mirror root when it is not the default
#                    https://<owner>.github.io/<repo>/ (custom domain, other host).
#   PUBLISH_MIRROR   set to "false" to skip the GitHub Pages deployment.
#
# One-time setup for the mirror: Settings -> Pages -> Source: "GitHub Actions".
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

# Never run two releases at once, and never cancel one half-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # obtain the OIDC token that signs the provenance attestation
      attestations: write # store the provenance attestation
    # One build at a time: compiling the generated client needs about 4 GB per
    # target and two in parallel exhaust the 7 GB runner.
    timeout-minutes: 60
    env:
      HAVE_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      MIRROR_URL: ${{ vars.MIRROR_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds never use the Actions cache (cache poisoning).
          cache: false
      - name: Import GPG key
        id: import_gpg
        if: env.HAVE_GPG == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact version: a range would let an upstream release change what
          # builds our artifacts without a reviewed commit here.
          version: v2.18.2 # renovate: datasource=github-releases depName=goreleaser/goreleaser
          # `cond && '' || x` always yields x because '' is falsy, so the
          # condition is inverted to put the non-empty value first.
          args: release --clean --parallelism 1 ${{ env.HAVE_GPG != 'true' && '--skip=sign' || '' }}
        env:
          GOGC: "50"
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_manifest.json
      - name: Build network mirror index
        # The JSON points at the release assets; earlier versions are carried
        # over from the currently published mirror so they stay installable.
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          go run ./tools/mirror-index \
            -dist dist -out dist/mirror \
            -base-url "https://github.com/${REPOSITORY}/releases/download/${TAG}/" \
            -merge-from "$MIRROR_URL" \
            -mirror-url "$MIRROR_URL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirror
          path: dist/mirror
          retention-days: 30
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: vars.PUBLISH_MIRROR != 'false'
        with:
          path: dist/mirror

  pages:
    name: Deploy network mirror to GitHub Pages
    needs: goreleaser
    if: vars.PUBLISH_MIRROR != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # authenticate the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
        continue-on-error: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
