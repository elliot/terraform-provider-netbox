# Publishes a GitHub Release whenever a v* tag is pushed and refreshes the
# provider network mirror on GitHub Pages (docs/INSTALL.md).
#
# Optional repository secrets:
#   GPG_PRIVATE_KEY, PASSPHRASE   sign the checksum file (needed only by the public
#                                 Terraform Registry). Without them the release is
#                                 built unsigned and remains installable through the
#                                 mirror, scripts/install.sh or a filesystem mirror.
# Optional repository variables:
#   MIRROR_URL       public URL of the mirror root when it is not the default
#                    https://<owner>.github.io/<repo>/ (custom domain, other host).
#   PUBLISH_MIRROR   set to "false" to skip the GitHub Pages deployment.
#
# One-time setup for the mirror: Settings -> Pages -> Source: "GitHub Actions".
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAVE_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
      MIRROR_URL: ${{ vars.MIRROR_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        id: import_gpg
        if: env.HAVE_GPG == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.HAVE_GPG == 'true' && '' || '--skip=sign' }}
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build network mirror index
        # The JSON points at the release assets; earlier versions are carried
        # over from the currently published mirror so they stay installable.
        run: |
          go run ./tools/mirror-index \
            -dist dist -out dist/mirror \
            -base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            -merge-from "$MIRROR_URL" \
            -mirror-url "$MIRROR_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: mirror
          path: dist/mirror
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_MIRROR != 'false'
        with:
          path: dist/mirror

  pages:
    name: Deploy network mirror to GitHub Pages
    needs: goreleaser
    if: vars.PUBLISH_MIRROR != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - id: deployment
        uses: actions/deploy-pages@v4
