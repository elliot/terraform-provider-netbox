name: CodeQL (workflows)

# Code scanning for the GitHub Actions workflows. Kept apart from codeql.yml so
# each language uploads its own analysis and the actions scan does not wait for
# the Go build. Results appear under Security -> Code scanning.
#
# Runs on every pull request (no build, about a minute): without a
# /language:actions analysis on the PR, the CodeQL summary check cannot compare
# against main and reports "1 configuration not found" as neutral.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/**"
  schedule:
    # Weekly, Monday 04:23 UTC, so new queries run against unchanged workflows too.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
      security-events: write # upload code scanning results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: actions
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:actions
