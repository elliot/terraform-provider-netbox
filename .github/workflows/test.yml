name: Tests

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        # Only pushes to main write caches (Save Go cache below); pull requests restore them.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-build-
      - run: go mod download
      - run: go build -v ./...
      - run: go vet ./...
      - name: golangci-lint
        # Same package list as `make lint`: linting the generated client and
        # resources exhausts the runner (the job was killed after ~8 minutes).
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2 # renovate: datasource=github-releases depName=golangci/golangci-lint
          args: . ./internal/acctest/... ./internal/client/... ./internal/conv/... ./internal/customfields/... ./internal/gen/... ./internal/provider ./internal/provider/manual/... ./tools/...
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-${{ github.sha }}

  generate:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-build-
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false
      - name: Generated code is up to date
        run: make gen-check
      - name: Docs are up to date
        run: |
          make docs
          git diff --exit-code -- docs/ templates/
      - name: Docs validate
        run: make docs-check

  test:
    name: Unit tests (terraform ${{ matrix.terraform }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.13.*"
          - "1.14.*"
          - "1.16.*"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-test-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-test-
            go-${{ runner.os }}-build-
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: go test (TF_ACC unset)
        env:
          TF_ACC: ""
        run: go test ./internal/... -count=1 -v -cover -timeout 15m
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.terraform == '1.14.*'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ hashFiles('go.sum') }}-${{ github.sha }}

  package:
    # Builds the release artifacts exactly as the release workflow does (unsigned,
    # nothing published), generates the network mirror index and installs the
    # snapshot through both the network mirror and scripts/install.sh.
    name: Package (goreleaser snapshot + install smoke test)
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    # Targets are built one at a time: a cold compile of the generated client
    # peaks at about 4.6 GB, and GoReleaser's default of one build per CPU gets
    # the runner killed ("received a shutdown signal"). With a warm cache a
    # target takes seconds, so the timeout only matters when netbox/ changes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Restore Go cache
        # Cross-compiled objects for all eight targets, written only by pushes to
        # main. The snapshot is never published; release.yml builds without any
        # cache, so a cache entry cannot reach a release asset.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-package-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-package-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-package-
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2 # renovate: datasource=github-releases depName=goreleaser/goreleaser
          args: release --snapshot --clean --skip=sign,publish --parallelism 1
        env:
          GOGC: "50"
      - name: Build network mirror index
        run: go run ./tools/mirror-index -dist dist -out dist/mirror
      - name: Install through network mirror and install.sh
        run: ./scripts/mirror-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_manifest.json
          retention-days: 7
      - name: Save Go cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-package-${{ hashFiles('go.sum') }}-${{ github.sha }}
