name: Tests

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -v ./...
      - run: go vet ./...
      - name: golangci-lint
        # Same package list as `make lint`: linting the generated client and
        # resources exhausts the runner (the job was killed after ~8 minutes).
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: run . ./internal/acctest/... ./internal/client/... ./internal/conv/... ./internal/customfields/... ./internal/gen/... ./internal/provider ./internal/provider/manual/... ./tools/...

  generate:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false
      - name: Generated code is up to date
        run: make gen-check
      - name: Docs are up to date
        run: |
          make docs
          git diff --exit-code -- docs/ templates/

  test:
    name: Unit tests (terraform ${{ matrix.terraform }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - "1.13.*"
          - "1.14.*"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: go test (TF_ACC unset)
        env:
          TF_ACC: ""
        run: go test ./internal/... -count=1 -v -cover -timeout 15m

  package:
    # Builds the release artifacts exactly as the release workflow does (unsigned,
    # nothing published), generates the network mirror index and installs the
    # snapshot through both the network mirror and scripts/install.sh.
    name: Package (goreleaser snapshot + install smoke test)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,publish
      - name: Build network mirror index
        run: go run ./tools/mirror-index -dist dist -out dist/mirror
      - name: Install through network mirror and install.sh
        run: ./scripts/mirror-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_manifest.json
          retention-days: 7
